name: CI

on:
  push:
    branches: [ canon ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [ canon ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: xdebug
          tools: composer:v2
          ini-values: memory_limit=-1

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
          composer-options: --no-interaction --prefer-dist --optimize-autoloader

      - name: PHPUnit (coverage artifacts for Infection)
        run: |
          mkdir -p build/coverage-xml
          vendor/bin/phpunit \
            --coverage-xml build/coverage-xml \
            --log-junit build/coverage-xml/phpunit.junit.xml

#      - run: vendor/bin/phpunit

      - name: Infection
        run: |
          vendor/bin/infection \
            --threads=4 \
            --coverage=build/coverage-xml \
            --min-msi=100 \
            --ansi \
            --log-verbosity=all

#      - name: Infection (8.4 only)
#        if: ${{ matrix.php == '8.4' }}
#        run: vendor/bin/infection --threads=4 --coverage=build/coverage-xml --min-msi=100 --ansi --log-verbosity=all
